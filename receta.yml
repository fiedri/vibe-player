Builds:
  - versionName: 0.5.1
    versionCode: 6
    commit: 6fec4cf83633209eeba763141684f38a55d75135
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
      - npm install -g pnpm@9
    init:
      - cd ../..
      - pnpm install --no-frozen-lockfile
      - BUILD_ID=$$COMMIT$$ pnpm build
      - npx cap sync android
      - find node_modules -type f \( -name "*.node" -o -name "*.so*" -o -name "*.wasm"
        -o -name "*.tar.gz" -o -name "*.jar" -o -name "esbuild" -o -name ".jekyll-metadata"
        \) -delete
    gradle:
      - yes

